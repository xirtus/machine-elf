<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='none' stroke='%237ef9e0' stroke-width='1.4'/><circle cx='8' cy='8' r='2.2' fill='%23ff6ad5'/></svg>" />
<title>MACHINE ELF — Hyperspace Descent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M8 2 L13 8 L8 14 L3 8 Z' fill='none' stroke='%237ef9e0'/%3E%3Ccircle cx='8' cy='8' r='1.6' fill='%23ff3ea5'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { font-family: ui-monospace, "SF Mono", Menlo, monospace; cursor:none; }
  #gl { position:fixed; inset:0; display:block; width:100%; height:100%; }
  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #boot {
    position:fixed; inset:0; z-index:100; display:grid; place-items:center;
    background:#000; color:#7ef9e0; letter-spacing:.35em; font-size:12px;
    transition:opacity .8s ease; text-transform:uppercase;
  }
  #boot.hidden { opacity:0; pointer-events:none; }
  #boot .inner { text-align:center; }
  #boot .bar { width:220px; height:1px; background:#123; margin:18px auto 0; overflow:hidden; }
  #boot .bar i { display:block; height:100%; width:0%; background:#7ef9e0; transition:width .3s ease; }
  #err { position:fixed; inset:0; z-index:200; display:none; place-items:center; padding:40px;
         background:#080008; color:#ff6ad5; font-size:13px; line-height:1.7; white-space:pre-wrap; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="ui"></div>
  <div id="boot"><div class="inner"><div id="bootmsg">initializing hyperspace</div><div class="bar"><i id="bootbar"></i></div></div></div>
  <div id="err"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
